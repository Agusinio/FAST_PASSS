<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST >>> PASS (v2.9.5 - TACTICAL)</title>
    <link rel="stylesheet" href="./style.css?v=33">
</head>
<body>
    <div id="main-content">
        <div class="main-upper">
        <div class="upper-left">
        
        <!-- SECTION: SETUP -->
        <div class="section-container">
            <div class="section-label"><span>INICI</span></div>
            <div class="section-content">
                <div class="setup-top-row">
                    <div class="semaforo-strip">
                    <div style="display: flex; justify-content: flex-end; margin-bottom: 4px;">
                        <button id="btnSetup" class="icon-button red" title="Configuració">⚙️</button>
                    </div>
                    <div class="semaforo-item" title="Estat de l'Escaleta JSON (Servidor)">
                        <div id="sem-esc" class="light off"></div>
                        <span>ESC</span>
                    </div>
                    <div class="semaforo-item" title="MP4 CleanFeed al projecte/timeline">
                        <div id="sem-mp4" class="light off"></div>
                        <span>MP4</span>
                    </div>
                    <div class="semaforo-item" title="Rètols (Wotts) al Bin CHY">
                        <div id="sem-wot" class="light off"></div>
                        <span>WOT</span>
                    </div>
                    <div class="semaforo-item" title="Subtítols projectats al timeline">
                        <div id="sem-srt" class="light off"></div>
                        <span>SRT</span>
                    </div>
                    </div>
                    <button id="btnFetchEscaleta" class="secondary btn-sq-double-high" title="Fer foto actualitzada de l'escaleta via API digition (Ctrl+clic = foto d'AHIR, per corregir/comparar el dia anterior)" style="background:#5a2a2a; color:#f99;">📷 FOTO</button>
                </div>
                <div class="setup-grid">
                    <div class="setup-inputs">
                        
                        <div class="inline-input-group">
                            <label for="programa">PROG:</label>
                            <select id="programa"><option value="">Tria...</option></select>
                        </div>
                        <div class="inline-input-group">
                            <label for="bloc">BLOC:</label>
                            <select id="bloc">
                                <option value="---">--- SELECCIONA BLOC ---</option>
                                <option value="V1">V1</option>
                                <option value="V2">V2</option>
                                <option value="V3">V3</option>
                                <option value="V4">V4</option>
                                <option value="V5">V5</option>
                            </select>
                        </div>
                        <div class="inline-input-group">
                            <label for="conductor">COND:</label>
                            <select id="conductor"><option value="">Tria...</option></select>
                        </div>
                        
                    </div>
                    <div class="setup-button-container">
                        <button id="btnMainAction" class="btn-big-sq">NOU</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION: VÍDEO -->
        <div class="section-container">
            <div class="section-label"><span>VÍDEO</span></div>
            <div class="section-content">
                <div class="video-tactical-layout">
                    <div class="video-row-top">
                        <button id="btnIn" class="secondary btn-sq-std">IN</button>
                        <button id="btnScene" class="secondary btn-wide-flex">TROSSEJA</button>
                        <button id="btnOut" class="secondary btn-sq-std">OUT</button>
                        <button id="btnCenter" class="secondary btn-sq-double-high" title="Toggle Auto Reframe">REFRAME</button>
                    </div>
                    <div class="video-row-bottom">
                        <button id="btnPrevClip" class="secondary btn-sq-std">◀</button>
                        <div class="slider-zone" id="sliderZone" title="Clica per activar/desactivar el reencuadre manual">
                            <input type="range" id="slider-move" min="-1000" max="1000" value="0" disabled>
                        </div>
                        <button id="btnNextClip" class="secondary btn-sq-std">▶</button>
                        <button id="btnKey" class="secondary btn-sq-double-high">KEYFRAME</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- FILA 1 (TEST): GRÀFICS + MARCADORS · (TREBALL): GRÀFICS + CHYRONS -->
        <div class="graphics-group">
        <!-- SECTION: GRÀFICS (sempre visible) -->
        <div class="section-container">
            <div class="section-label"><span>GRÀFICS</span></div>
            <div class="section-content">
                 <div class="graphics-strip">
                    <button id="btnMarksF6" class="secondary" title="Gràfica — col·loca els marcadors/gràfics GF de l'escaleta al seu ancla">GRAF</button>
                    <button id="btnGrafIpd" class="secondary" title="Toggle IPD sobre el clip seleccionat · Ctrl+clic = revisa els clips IPD (marcador IPD → següent estructural)">IPD</button>
                    <button id="btnGrafDoblePantalla" class="secondary" title="Doble Pantalla V2/V3">DP</button>
                    <button id="btnGrafMapa" class="secondary" title="Mapa zoom">MAPA</button>
                    <button id="btnGrafTotem" class="secondary" title="Tòtem">TOTEM</button>
                 </div>
            </div>
        </div>

        <!-- SECTION: MARCADORS (TEST ONLY) - fila 1 en TEST -->
        <div class="section-container test-only">
            <div class="section-label"><span>MARCADORS</span></div>
            <div class="section-content">
                 <div class="graphics-strip">
                    <button id="btnMarksF1" class="secondary" title="F1 · Marcadors OnAir (TC real d'emissió)">OnAir</button>
                    <button id="btnMarksF2" class="secondary" title="F2 · Marcadors OnAir deduïts">Dedu</button>
                    <button id="btnMarksF3" class="secondary" title="F3 · Marcadors previstos (coincidències)">Prev</button>
                    <button id="btnMarksF35" class="secondary" title="F3.5 · CorrelationSnap a corts de vídeo">Correl</button>
                    <button id="btnMarksF4" class="secondary" title="F4 · DensitySnap / faros">Dens</button>
                    <button id="btnMarksF5" class="secondary" title="F5 · OrphanSnap (marcadors orfes a corts propers)">Orphan</button>
                 </div>
            </div>
        </div>

        <div class="row-break test-only"></div>

        <!-- SECTION: CHYRONS - fila 2 amb SUBTÍTOLS (en TREBALL: COLOCAR + REPARTIR; la resta test-only) -->
        <div class="section-container">
            <div class="section-label"><span>CHYRONS</span></div>
            <div class="section-content">
                 <div class="graphics-strip">
                    <button id="btnChyronColocar" class="secondary" title="Col·loca TOTS els chyrons: Conductor, Titol, Lloc, Nom, Resto i Traducció (verifica primer els marcadors)">COLOCAR</button>
                    <button id="btnChyronRepartir" class="secondary" title="Reparteix les traduccions seleccionades">REPART</button>
                    <button id="btnChyronConductor" class="secondary test-only" title="Col·loca el Conductor (TEST)">COND</button>
                    <button id="btnChyronTitol" class="secondary test-only" title="Col·loca el Tema-Titol (TEST)">TITOL</button>
                    <button id="btnChyronLloc" class="secondary test-only" title="Col·loca Lloc/Data (TEST)">LLOC</button>
                    <button id="btnChyronNom" class="secondary test-only" title="Col·loca Nom/Càrrec (TEST)">NOM</button>
                    <button id="btnChyronResto" class="secondary test-only" title="Col·loca la resta de chyrons (TEST)">RESTO</button>
                    <button id="btnChyronTraduccio" class="secondary test-only" title="Col·loca traduccions (TEST)">TRAD</button>
                 </div>
            </div>
        </div>

        <!-- SECTION: SUBTÍTOLS (sempre visible) - fila 2 amb CHYRONS -->
        <div class="section-container">
            <div class="section-label"><span>SUBTÍTOLS</span></div>
            <div class="section-content">
                <div style="display:flex; flex-direction:column; gap:6px;">
                    <div style="display:flex; gap:4px; flex-wrap:nowrap;">
                        <button id="btnSrtLoad" class="secondary srt-top">CARREGAR</button>
                        <button id="btnSrtExport" class="secondary srt-top">EXPORTAR</button>
                        <button id="btnSrtReset" class="secondary srt-top" style="background:#5a2a2a; color:#f99;">RESET</button>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button id="btnSrtIn" class="secondary srt-inout">IN</button>
                        <button id="btnSrtOut" class="secondary srt-inout">OUT</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row-break"></div>

        <!-- SECTION: RENDER (sempre visible) - fila pròpia -->
        <div class="section-container">
            <div class="section-label"><span>RENDER</span></div>
            <div class="section-content">
                <div class="render-strip">
                    <button id="btnRenderVideo" class="secondary srt-inout">VÍDEO</button>
                    <button id="btnRenderPortada" class="secondary srt-inout">PORTADA</button>
                    <button id="btnRenderClose" class="secondary srt-inout">TANCAR</button>
                </div>
                <div style="display:flex; align-items:center; gap:6px; margin-top:6px;">
                    <button id="btnMode" class="icon-button" title="Alternar layout TEST / TREBALL" style="flex:0 0 auto;">🧪</button>
                    <div id="layoutInfo" style="font-size:12px; color:#fff; flex:1;">📐 —</div>
                </div>
            </div>
        </div>
        </div>
        <div id="splitter" title="Arrossega per redimensionar"></div>
        </div>
        <div class="right-zone">
            <div id="srtVideoWrap">
                <video id="srtVideo" playsinline muted></video>
                <div id="srtVideoSubs"></div>
            </div>
        </div>
        </div>

        <!-- ZONA TIMELINE SUBTÍTOLS (ample complet) -->
        <div class="srt-timeline-zone">
            <div id="srtEditorContainer" style="display:none;">
                <div style="overflow-x:hidden; overflow-y:hidden;">
                    <canvas id="srtCanvas" width="1800" height="150" style="cursor:crosshair; background:#1a1a1a;"></canvas>
                </div>
                <div class="srt-zoombar" id="srtZoomBar" title="Arrossega els extrems per fer zoom · arrossega el centre per desplaçar-te">
                    <div class="srt-zoombar-fill" id="srtZoomFill"></div>
                    <div class="srt-zoombar-handle srt-zoombar-handle-l" id="srtZoomHandleL"></div>
                    <div class="srt-zoombar-handle srt-zoombar-handle-r" id="srtZoomHandleR"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- OVERLAY: SETUP -->
    <div id="setup-overlay">
        <iframe id="setup-iframe" src="about:blank"></iframe>
    </div>

    <!-- SCRIPTS with version cachebuster -->
    <script src="js/lib/CSInterface.js"></script>
    <script src="js/core/utils.js?v=5"></script>
    <script src="js/core/11_Configuracio.js?v=5"></script>
    <script src="js/core/escaleta_timecode.js?v=5"></script>
    <script src="js/core/escaleta_config.js?v=5"></script>
    <script src="js/core/escaleta_io.js?v=5"></script>
    <script src="js/core/escaleta_items.js?v=5"></script>
    <script src="js/core/escaleta_bounds.js?v=5"></script>
    <script src="js/core/escaleta_fallback.js?v=5"></script>
    <script src="js/core/escaleta_fetch.js?v=5"></script>
    <script src="js/core/escaleta_reader.js?v=5"></script>
    <script src="js/core/session_manifest.js?v=6"></script>
    <script src="js/core/state.js?v=5"></script>
    <script src="js/inspectors/1_SourceAssets.js?v=5"></script>
    <script src="js/logic/Scanner.js?v=5"></script>
    <script src="js/inspectors/2_App.js?v=5"></script>
    <script src="js/inspectors/3_Session.js?v=5"></script>
    <script src="js/core/4_Context.js?v=5"></script>
    <script src="js/logic/3_Project_Logic.js?v=6"></script>
    <script src="js/logic/5_Tracks_Logic.js?v=5"></script>
    <script src="js/logic/6_Clips_Logic.js?v=5"></script>
    <script src="js/logic/7_KF_Logic.js?v=5"></script>
    <script src="js/logic/9_Render_Logic.js?v=5"></script>
    <script src="js/logic/10_Srt_Logic.js?v=9"></script>
    <script src="js/logic/13_Parse.js?v=5"></script>
    <script src="js/logic/14_Assembly_Logic.js?v=6"></script>
    <script src="js/logic/15_FFmpeg_Logic.js?v=5"></script>
    <script src="js/logic/16_Analysis_Logic.js?v=5"></script>
    <script src="js/core/assembly_context.js?v=5"></script>
    <script src="js/workflows/flow_mp4.js?v=5"></script>
    <script src="js/workflows/flow_markers.js?v=5"></script>
    <script src="js/workflows/flow_chyrons.js?v=6"></script>
    <script src="js/workflows/flow_graphics.js?v=5"></script>
    <script src="js/workflows/flow_mainButton.js?v=6"></script>
    <script src="js/workflows/flow_cut.js?v=11"></script>
    <script src="js/workflows/flow_retols.js?v=5"></script>
    <script src="js/workflows/flow_srt.js?v=5"></script>
    <script src="js/workflows/flow_render.js?v=6"></script>
    <script src="js/workflows/flow_KF.js?v=10"></script>
    <script src="js/workflows/flow_config.js?v=5"></script>
    <script src="js/workflows/flow_assembly.js?v=5"></script>
    <script src="js/core/project_registry.js?v=5"></script>
    <script src="js/editor/srt_editor.js?v=54"></script>
    <script src="js/main.js?v=24"></script>
</body>
</html>
