<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST >>> PASS (v2.9.5 - TACTICAL)</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="main-content">
        
        <!-- SECTION: SETUP -->
        <div class="section-container">
            <div class="section-label"><span>SETUP</span></div>
            <div class="section-content">
                <div class="semaforo-strip">
                    <div style="display: flex; justify-content: flex-end; margin-bottom: 4px;">
                        <button id="btnSetup" class="icon-button red" title="Configuració">⚙️</button>
                    </div>
                    <div class="semaforo-item" title="Estat de l'Escaleta JSON (Servidor)">
                        <div id="sem-esc" class="light off"></div>
                        <span>ESC</span>
                    </div>
                    <div class="semaforo-item" title="MP4 CleanFeed al projecte/timeline">
                        <div id="sem-mp4" class="light off"></div>
                        <span>MP4</span>
                    </div>
                    <div class="semaforo-item" title="Rètols (Wotts) al Bin CHY">
                        <div id="sem-wot" class="light off"></div>
                        <span>WOT</span>
                    </div>
                    <div class="semaforo-item" title="Subtítols projectats al timeline">
                        <div id="sem-srt" class="light off"></div>
                        <span>SRT</span>
                    </div>
                </div>
                <div class="setup-grid">
                    <div class="setup-inputs">
                        
                        <div class="inline-input-group">
                            <label for="programa">PROG:</label>
                            <select id="programa"><option value="">Tria...</option></select>
                        </div>
                        <div class="inline-input-group">
                            <label for="bloc">BLOC:</label>
                            <select id="bloc">
                                <option value="---">--- SELECCIONA BLOC ---</option>
                                <option value="V1">V1</option>
                                <option value="V2">V2</option>
                                <option value="V3">V3</option>
                                <option value="V4">V4</option>
                                <option value="V5">V5</option>
                            </select>
                        </div>
                        <div class="inline-input-group">
                            <label for="conductor">COND:</label>
                            <select id="conductor"><option value="">Tria...</option></select>
                        </div>
                        
                    </div>
                    <div class="setup-button-container">
                        <button id="btnMainAction" class="btn-big-sq">NOU</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION: VÍDEO -->
        <div class="section-container">
            <div class="section-label"><span>VÍDEO</span></div>
            <div class="section-content">
                <div class="video-tactical-layout">
                    <div class="video-row-top">
                        <button id="btnIn" class="secondary btn-sq-std">IN</button>
                        <button id="btnScene" class="secondary btn-wide-flex">TROSEJA</button>
                        <button id="btnOut" class="secondary btn-sq-std">OUT</button>
                        <button id="btnCenter" class="secondary btn-sq-double-high" title="Toggle Auto Reframe">REFRAME</button>
                    </div>
                    <div class="video-row-bottom">
                        <button id="btnPrevClip" class="secondary btn-sq-std">◀</button>
                        <div class="slider-container">
                            <input type="range" id="slider-move" min="-1000" max="1000" value="0">
                        </div>
                        <button id="btnNextClip" class="secondary btn-sq-std">▶</button>
                        <button id="btnKey" class="secondary btn-sq-double-high">KEYFRAME</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- SECTION: GRÀFICS -->
        <div class="section-container">
            <div class="section-label"><span>GRÀFICS</span></div>
            <div class="section-content">
                 <div class="graphics-strip">
                    <button id="btnMarksF1" class="secondary btn-sq-double-high">OnAir</button>
                    <button id="btnMarksF2" class="secondary btn-sq-double-high">Dedu</button>
                    <button id="btnMarksF3" class="secondary btn-sq-double-high">Prev</button>
                    <button id="btnMarksF35" class="secondary btn-sq-double-high">Correl</button>
                    <button id="btnMarksF4" class="secondary btn-sq-double-high">Density</button>
                    <button id="btnMarksF5" class="secondary btn-sq-double-high">OrphanSnap</button>
                    <button id="btnMarksF6" class="secondary btn-sq-double-high">Gràfics</button>
                 </div>
            </div>
        </div>

        <!-- SECTION: CHYRONS -->
        <div class="section-container">
            <div class="section-label"><span>CHYRONS</span></div>
            <div class="section-content">
                 <div class="graphics-strip">
                    <button id="btnChyronConductor" class="secondary btn-sq-double-high">Conductor</button>
                    <button id="btnChyronTitol" class="secondary btn-sq-double-high">Titol</button>
                    <button id="btnChyronLloc" class="secondary btn-sq-double-high">Lloc</button>
                    <button id="btnChyronNom" class="secondary btn-sq-double-high">Nom</button>
                    <button id="btnChyronResto" class="secondary btn-sq-double-high">Resto</button>
                    <button id="btnChyronTraduccio" class="secondary btn-sq-double-high">Traducció</button>
                    <button id="btnChyronRepartir" class="secondary btn-sq-double-high">Repartir</button>
                 </div>
            </div>
        </div>

        <!-- SECTION: SUBTÍTOLS EDITOR -->
        <div class="section-container">
            <div class="section-label"><span>SUBTÍTOLS</span></div>
            <div class="section-content">
                <!-- Fila superior: botons + preview -->
                <div style="display:flex; gap:4px; align-items:stretch; min-height:60px;">
                    <div style="display:flex; gap:3px; flex-wrap:wrap; align-content:flex-start; flex:1;">
                        <button id="btnSrtLoad" class="secondary btn-sq-double-high">CARREGAR</button>
                        <button id="btnSrtIn" class="secondary btn-sq-double-high">IN</button>
                        <button id="btnSrtOut" class="secondary btn-sq-double-high">OUT</button>
                        <button id="btnSrtAdjust" class="secondary btn-sq-double-high">AJUSTAR</button>
                        <button id="btnSrtExport" class="secondary btn-sq-double-high">EXPORTAR</button>
                        <div style="width:100%;"></div>
                        <button id="btnSrtPlay" class="secondary btn-sq-double-high" style="background:#2a5a2a; color:#8f8;">▶ PLAY</button>
                        <button id="btnZoomIn" class="secondary btn-sq-std" style="font-size:16px; width:32px;">+</button>
                        <button id="btnZoomOut" class="secondary btn-sq-std" style="font-size:16px; width:32px;">−</button>
                        <span id="zoomLabel" style="font:11px sans-serif; color:#888; align-self:center; margin-left:4px;">20px/s</span>
                    </div>
                    <div id="srtPreview" style="width:210px; min-width:160px; height:70px; background:#2a2a2a; border-radius:4px; padding:8px; color:#eee; font:16px/1.4 sans-serif; overflow-y:auto; display:flex; flex-direction:column; justify-content:flex-end;"></div>
                </div>
                <!-- Timeline (canvas) -->
                <div id="srtEditorContainer" style="margin-top:4px; display:none;">
                    <div style="overflow-x:auto; overflow-y:hidden;">
                        <canvas id="srtCanvas" width="1800" height="150" style="cursor:pointer; background:#1a1a1a;"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION: RENDER -->
        <div class="section-container">
            <div class="section-label"><span>RENDER</span></div>
            <div class="section-content">
                <div class="render-strip">
                    <button id="btnRenderVideo" class="secondary btn-sq-double-high">VÍDEO</button>
                    <button id="btnRenderPortada" class="secondary btn-sq-double-high">PORTADA</button>
                    <button id="btnRenderClose" class="secondary btn-sq-double-high">TANCAR</button>
                </div>
            </div>
        </div>

    </div>

    <!-- OVERLAY: SETUP -->
    <div id="setup-overlay">
        <iframe id="setup-iframe" src="about:blank"></iframe>
    </div>

    <!-- SCRIPTS with version cachebuster -->
    <script src="js/lib/CSInterface.js"></script>
    <script src="js/core/utils.js?v=2"></script>
    <script src="js/core/11_Configuracio.js?v=2"></script>
    <script src="js/core/escaleta_timecode.js?v=2"></script>
    <script src="js/core/escaleta_config.js?v=2"></script>
    <script src="js/core/escaleta_io.js?v=2"></script>
    <script src="js/core/escaleta_items.js?v=2"></script>
    <script src="js/core/escaleta_bounds.js?v=2"></script>
    <script src="js/core/escaleta_fallback.js?v=2"></script>
    <script src="js/core/escaleta_reader.js?v=2"></script>
    <script src="js/core/session_manifest.js?v=2"></script>
    <script src="js/core/state.js?v=2"></script>
    <script src="js/inspectors/1_SourceAssets.js?v=2"></script>
    <script src="js/logic/Scanner.js?v=2"></script>
    <script src="js/inspectors/2_App.js?v=2"></script>
    <script src="js/inspectors/3_Session.js?v=2"></script>
    <script src="js/core/4_Context.js?v=2"></script>
    <script src="js/logic/3_Project_Logic.js?v=2"></script>
    <script src="js/logic/5_Tracks_Logic.js?v=2"></script>
    <script src="js/logic/6_Clips_Logic.js?v=2"></script>
    <script src="js/logic/7_KF_Logic.js?v=2"></script>
    <script src="js/logic/9_Render_Logic.js?v=2"></script>
    <script src="js/logic/10_Srt_Logic.js?v=2"></script>
    <script src="js/logic/13_Parse.js?v=2"></script>
    <script src="js/logic/14_Assembly_Logic.js?v=2"></script>
    <script src="js/logic/15_FFmpeg_Logic.js?v=2"></script>
    <script src="js/logic/16_Analysis_Logic.js?v=2"></script>
    <script src="js/core/assembly_context.js?v=2"></script>
    <script src="js/workflows/flow_mp4.js?v=2"></script>
    <script src="js/workflows/flow_markers.js?v=2"></script>
    <script src="js/workflows/flow_chyrons.js?v=2"></script>
    <script src="js/workflows/flow_graphics.js?v=2"></script>
    <script src="js/workflows/flow_mainButton.js?v=2"></script>
    <script src="js/workflows/flow_cut.js?v=2"></script>
    <script src="js/workflows/flow_retols.js?v=2"></script>
    <script src="js/workflows/flow_srt.js?v=2"></script>
    <script src="js/workflows/flow_render.js?v=2"></script>
    <script src="js/workflows/flow_KF.js?v=2"></script>
    <script src="js/workflows/flow_config.js?v=2"></script>
    <script src="js/workflows/flow_assembly.js?v=2"></script>
    <script src="js/core/project_registry.js?v=2"></script>
    <script src="js/editor/srt_editor.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
</body>
</html>
