<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST >>> PASS (v2.9.5 - TACTICAL)</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="main-content">
        
        <!-- SECTION: SETUP -->
        <div class="section-container">
            <div class="section-label"><span>SETUP</span></div>
            <div class="section-content">
                <div style="display: flex; justify-content: flex-end; margin-bottom: 4px;">
                    <button id="btnSetup" class="icon-button red" title="Configuració">⚙️</button>
                </div>
                <div class="setup-grid">
                    <div class="setup-inputs">
                        <div class="inline-input-group">
                            <label for="programa">PROG:</label>
                            <select id="programa"><option value="">Tria...</option></select>
                        </div>
                        <div class="inline-input-group">
                            <label for="bloc">BLOC:</label>
                            <select id="bloc">
                                <option value="---">--- SELECCIONA BLOC ---</option>
                                <option value="V1">V1</option>
                                <option value="V2">V2</option>
                                <option value="V3">V3</option>
                                <option value="V4">V4</option>
                                <option value="V5">V5</option>
                            </select>
                        </div>
                        <div class="inline-input-group">
                            <label for="conductor">COND:</label>
                            <select id="conductor"><option value="">Tria...</option></select>
                        </div>
                    </div>
                    <div class="setup-button-container">
                        <button id="btnMainAction" class="btn-big-sq">NOU</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION: VÍDEO -->
        <div class="section-container">
            <div class="section-label"><span>VÍDEO</span></div>
            <div class="section-content">
                <div class="video-tactical-layout">
                    <!-- Fila 1: IN, TROSEJA, OUT -->
                    <div class="video-row-top">
                        <button id="btnIn" class="secondary btn-sq-std">IN</button>
                        <button id="btnScene" class="secondary btn-wide-flex">TROSEJA</button>
                        <button id="btnOut" class="secondary btn-sq-std">OUT</button>
                        <button id="btnCenter" class="secondary btn-sq-double-high" title="Toggle Auto Reframe">REFRAME</button>
                    </div>
                    <!-- Fila 2: PREV, SLIDER, NEXT -->
                    <div class="video-row-bottom">
                        <button id="btnPrevClip" class="secondary btn-sq-std">◀</button>
                        <div class="slider-container">
                            <input type="range" id="slider-move" min="-1000" max="1000" value="0">
                        </div>
                        <button id="btnNextClip" class="secondary btn-sq-std">▶</button>
                        <button id="btnKey" class="secondary btn-sq-double-high">KEYFRAME</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- SECTION: GRÀFICS -->
        <div class="section-container">
            <div class="section-label"><span>GRÀFICS</span></div>
            <div class="section-content">
                 <div class="graphics-strip">
                    <button id="btnResetGrafs" class="secondary btn-sq-std reset-text" title="Limpiar Gráficos">RESET</button>
                    
                    <div class="retols-group">
                        <button id="btnPlaceChyrons" class="secondary">RETOLS</button>
                        <input type="text" id="txt-retol-part" placeholder="..." readonly>
                    </div>

                    <button id="btnPlaceGrafic" class="secondary btn-sq-std">GRAFIC</button>
                    <button id="btnPlaceGraph169" class="secondary btn-sq-std">16:9</button>
                    <button id="btnBg" class="secondary btn-sq-std">FONS</button>
                 </div>
            </div>
        </div>

        <!-- SECTION: SUBTÍTOLS -->
        <div class="section-container">
            <div class="section-label"><span>SUBTÍTOLS</span></div>
            <div class="section-content">
                <div class="srt-tactical-layout">
                    <button id="btnSrtWork" class="secondary btn-big-sq">PREPARAR</button>
                    
                    <div class="srt-central-column">
                        <div class="srt-row">
                            <button id="btnSrtIn" class="secondary btn-sq-std">IN</button>
                            <input type="text" id="txt-srt-in" placeholder="Inici...">
                        </div>
                        <div class="srt-row">
                            <button id="btnSrtOut" class="secondary btn-sq-std">OUT</button>
                            <input type="text" id="txt-srt-out" placeholder="Cua...">
                        </div>
                    </div>

                    <button id="btnTimeAdjust" class="secondary btn-big-sq">AJUSTAR</button>
                </div>
            </div>
        </div>

        <!-- SECTION: RENDER -->
        <div class="section-container">
            <div class="section-label"><span>RENDER</span></div>
            <div class="section-content">
                <div class="render-strip">
                    <button id="btnRenderVideo" class="secondary btn-big-sq-full">VÍDEO</button>
                    <button id="btnRenderPortada" class="secondary btn-big-sq-full">PORTADA</button>
                </div>
            </div>
        </div>

    </div> 

    <!-- LOGS -->
    <div class="debug-wrapper">
        <div class="debug-header">
            <div class="debug-title">Consola</div>
            <div class="context-lights">
                <div id="light-prog" class="light"></div><div id="light-bloc" class="light"></div>
                <div id="light-tema" class="light"></div><div id="light-seq" class="light"></div>
            </div>
            <div id="estado"></div>
        </div>
        <div id="console"></div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/lib/CSInterface.js"></script>
    <!-- Core: Infraestructura -->
    <script src="js/core/logger.js"></script>
    <script src="js/core/10_Eines.js"></script>
    <script src="js/core/11_Configuracio.js"></script>
    <script src="js/core/12_Estat.js"></script>
    <!-- Inspectors: Dades -->
    <script src="js/logic/22_Escaneig.js"></script>
    <script src="js/inspectors/21_Aplicacio.js"></script>
    <script src="js/inspectors/20_Sessio.js"></script>
    <!-- Core: Context -->
    <script src="js/core/13_Registre.js"></script>
    <script src="js/core/14_Sintesi.js"></script>
    <!-- Logic: Anàlisi i Dades -->
    <script src="js/logic/23_Analisi.js"></script>
    <!-- Logic: Edició -->
    <script src="js/logic/36_Projecte.js"></script>
    <script src="js/logic/31_Pistes.js"></script>
    <script src="js/logic/32_Segments.js"></script>
    <script src="js/logic/33_Animacio.js"></script>
    <script src="js/logic/34_Exportacio.js"></script>
    <script src="js/logic/35_Subtitols.js"></script>
    <script src="js/logic/37_Muntatge.js"></script>
    <!-- Workflows -->
    <script src="js/workflows/flux_principal.js"></script>
    <script src="js/workflows/flux_tall.js"></script>
    <script src="js/workflows/flux_retols.js"></script>
    <script src="js/workflows/flux_subtitols.js"></script>
    <script src="js/workflows/flux_exportacio.js"></script>
    <script src="js/workflows/flux_animacio.js"></script>
    <script src="js/workflows/flux_muntatge.js"></script>
    <!-- Registre de projectes i arrencada -->
    <script src="js/main.js"></script>
</body>
</html>
